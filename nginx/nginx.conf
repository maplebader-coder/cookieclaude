# Nginx 反向代理配置
# Claude 第三方管理客户端 v2.0
# 支持：HTTP → HTTPS 强制跳转、WebSocket SSE、静态文件、速率限制

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── 速率限制 ───────────────────────────────────────────────
    # 普通 API
    limit_req_zone  $binary_remote_addr  zone=api:10m  rate=30r/m;
    # OpenAI 兼容层（相对宽松）
    limit_req_zone  $binary_remote_addr  zone=openai:10m  rate=60r/m;
    # 认证接口（严格）
    limit_req_zone  $binary_remote_addr  zone=auth:10m  rate=5r/m;

    # ── upstream ───────────────────────────────────────────────
    upstream claude_backend {
        server backend:8765;
        keepalive 32;
    }

    # ── HTTP → HTTPS 强制跳转 ──────────────────────────────────
    server {
        listen 80;
        server_name _;

        # 健康检查直接返回（供 Docker/K8s 使用）
        location /health {
            proxy_pass http://claude_backend;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 主服务 ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书（自签名或 Let's Encrypt）
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 50M;

        # ── 前端静态文件 ─────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── 认证接口（严格速率限制）──────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://claude_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # ── SSE 流式对话（长连接，必须关闭缓冲）────────────────
        location /api/chat/completion {
            limit_req zone=api burst=5 nodelay;

            proxy_pass             http://claude_backend;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       Connection '';
            proxy_http_version     1.1;
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     300s;
            proxy_send_timeout     300s;
            chunked_transfer_encoding on;
        }

        # ── OpenAI 兼容层 SSE ────────────────────────────────
        location /v1/chat/completions {
            limit_req zone=openai burst=10 nodelay;

            proxy_pass             http://claude_backend;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       Authorization $http_authorization;
            proxy_set_header       Connection '';
            proxy_http_version     1.1;
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     300s;
            proxy_send_timeout     300s;
            chunked_transfer_encoding on;
        }

        # ── OpenAI 其他接口 ──────────────────────────────────
        location /v1/ {
            limit_req zone=openai burst=20 nodelay;

            proxy_pass         http://claude_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # ── 其余 API ────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://claude_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        # ── Swagger 文档 ─────────────────────────────────────
        location /docs {
            proxy_pass         http://claude_backend;
            proxy_set_header   Host $host;
        }

        location /openapi.json {
            proxy_pass         http://claude_backend;
            proxy_set_header   Host $host;
        }

        # ── 健康检查 ─────────────────────────────────────────
        location /health {
            proxy_pass http://claude_backend;
        }
    }
}
